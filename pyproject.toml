[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mfdep"
version = "1.2.0"
description = "Find every dependency of a DB2 table across mainframe JCL, PROC, COBOL, control-card and stored-procedure libraries"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mainframe", "db2", "cobol", "jcl", "dependency-analysis", "zos"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
]
# Deliberately no dependencies: this has to run on a locked-down box that
# mounts the share, where pip install of anything may not be an option.
dependencies = []

[project.scripts]
mfdep = "mfdep.cli:main"

[tool.setuptools]
# Declared explicitly rather than auto-discovered: the repo root also holds a
# mfdep.py launcher for running without installing, and flat-layout
# autodiscovery treats that as an ambiguous second top-level name.
packages = ["mfdep", "mfdep.parsers"]
py-modules = []
